[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-tools"
version = "1.0.0"
description = "Готовые функции для Telegram через официальный API (MTProto/Telethon)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36,<2",
    "python-dotenv>=1.0,<2",
    "rich>=13,<15",
]

[project.scripts]
tg = "tgtools.cli:main"

[tool.setuptools.packages.find]
include = ["tgtools*"]
